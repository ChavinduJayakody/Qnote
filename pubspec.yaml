name: qnote
description: "Qnote - A futuristic note-taking experience"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  uuid: ^4.5.3
  shared_preferences: ^2.3.4
  flutter_staggered_grid_view: ^0.7.0
  flutter_slidable: ^3.1.1
  intl: ^0.19.0
  animate_do: ^3.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
